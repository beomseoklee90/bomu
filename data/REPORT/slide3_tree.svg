<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%">
  <defs>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#dcfce7" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="680" height="340" rx="24" fill="url(#skyBg)"/>

  <!-- External Wind (Left) -->
  <g stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M45 105 Q95 95 135 110 T195 108"/>
    <path d="M30 155 Q85 145 130 160 T180 155"/>
    <path d="M55 205 Q105 195 145 210 T195 202"/>
  </g>
  <text x="110" y="75" font-family="Pretendard, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">외부의 시선 · 일시적 평가</text>

  <!-- Protective Dome / Shield -->
  <path d="M225 285 C215 130, 295 48, 390 48 C485 48, 565 130, 555 285" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M242 285 C235 148, 305 72, 390 72 C475 72, 545 148, 538 285" fill="none" stroke="#86efac" stroke-width="1.5"/>

  <!-- Ground -->
  <ellipse cx="390" cy="285" rx="195" ry="18" fill="#cbd5e1" opacity="0.45"/>
  <path d="M250 285 Q390 275 530 285" stroke="#64748b" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Tree Roots / Central Axis -->
  <line x1="390" y1="68" x2="390" y2="305" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <path d="M378 285 L384 195 L396 195 L402 285 Z" fill="#78350f"/>
  <path d="M390 225 L366 202" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
  <path d="M390 215 L414 194" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>

  <!-- Tree Canopy -->
  <circle cx="355" cy="175" r="36" fill="#22c55e" opacity="0.88"/>
  <circle cx="425" cy="175" r="36" fill="#16a34a" opacity="0.88"/>
  <circle cx="390" cy="142" r="46" fill="url(#canopyGrad)"/>

  <!-- Labels -->
  <rect x="330" y="294" width="120" height="26" rx="13" fill="#0f172a"/>
  <text x="390" y="311" font-family="Pretendard, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">내면의 중심축</text>

  <rect x="468" y="60" width="146" height="28" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="541" y="78" font-family="Pretendard, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">건강한 자기 보호막</text>
</svg>
