<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%">
  <rect width="680" height="320" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="340" y="38" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="700" fill="#64748b" text-anchor="middle">중간 단계를 허용하지 않는 극단적 이분법 스위치 (All-or-Nothing)</text>

  <!-- Left Button: 100% Perfection -->
  <g transform="translate(45, 58)">
    <rect width="258" height="162" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <circle cx="129" cy="50" r="26" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <text x="129" y="55" font-family="Pretendard, sans-serif" font-size="14" font-weight="900" fill="#c2410c" text-anchor="middle">100%</text>
    <text x="129" y="104" font-family="Pretendard, sans-serif" font-size="17" font-weight="800" fill="#9a3412" text-anchor="middle">완벽한 실행</text>
    <text x="129" y="132" font-family="Pretendard, sans-serif" font-size="13" font-weight="600" fill="#c2410c" text-anchor="middle">"3~4시간 각 잡고 완벽히 하기"</text>
  </g>

  <!-- Center OR Badge -->
  <circle cx="340" cy="139" r="20" fill="#1e293b"/>
  <text x="340" y="144" font-family="Pretendard, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">OR</text>

  <!-- Right Button: 0% Give Up -->
  <g transform="translate(377, 58)">
    <rect width="258" height="162" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="129" cy="50" r="26" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="129" y="55" font-family="Pretendard, sans-serif" font-size="14" font-weight="900" fill="#475569" text-anchor="middle">0%</text>
    <text x="129" y="104" font-family="Pretendard, sans-serif" font-size="17" font-weight="800" fill="#334155" text-anchor="middle">아예 포기 · 미루기</text>
    <text x="129" y="132" font-family="Pretendard, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">"제대로 못 할 거면 안 하기"</text>
  </g>

  <!-- Bottom Excluded Zone (1 hour attempt ignored) -->
  <g transform="translate(45, 240)">
    <rect width="590" height="52" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="295" y="31" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="700" fill="#64748b" text-anchor="middle">✕ 이분법적 기준 속에서는 '하루 1시간의 가벼운 시도'가 의미 없는 것으로 취급됩니다</text>
  </g>
</svg>
