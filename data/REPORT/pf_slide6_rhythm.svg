<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="100%">
  <defs>
    <linearGradient id="rhythmFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="680" height="300" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Grid -->
  <g stroke="#f1f5f9" stroke-width="1.5">
    <line x1="65" y1="75" x2="625" y2="75"/>
    <line x1="65" y1="135" x2="625" y2="135"/>
    <line x1="65" y1="195" x2="625" y2="195"/>
  </g>
  <line x1="65" y1="240" x2="625" y2="240" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Burnout Spike Wave (Dashed Orange) -->
  <path d="M 75 232 L 135 60 L 185 234 L 330 234 L 385 72 L 435 234 L 610 234"
        fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.85"/>

  <!-- Sustainable Rhythm Wave (Solid Teal/Green) -->
  <path d="M 75 162 C 145 142, 215 176, 285 158 C 355 140, 425 174, 495 156 C 545 142, 580 162, 615 150 L 615 240 L 75 240 Z"
        fill="url(#rhythmFill)"/>
  <path d="M 75 162 C 145 142, 215 176, 285 158 C 355 140, 425 174, 495 156 C 545 142, 580 162, 615 150"
        fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>

  <!-- Nodes on Sustainable Line -->
  <circle cx="180" cy="159" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
  <circle cx="345" cy="157" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
  <circle cx="515" cy="155" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>

  <!-- Legends -->
  <g transform="translate(75, 22)">
    <rect x="0" y="0" width="250" height="30" rx="15" fill="#fff7ed" stroke="#fed7aa"/>
    <line x1="16" y1="15" x2="40" y2="15" stroke="#f97316" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="48" y="19" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="700" fill="#c2410c">무리한 몰입 후 번아웃 (에너지 방전)</text>
  </g>

  <g transform="translate(345, 22)">
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#ecfdf5" stroke="#a7f3d0"/>
    <line x1="16" y1="15" x2="40" y2="15" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round"/>
    <text x="48" y="19" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="800" fill="#047857">에너지를 남기며 이어가는 리듬 (월 44시간 달성)</text>
  </g>

  <text x="345" y="276" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle">한 번의 무리한 몰입보다 매일 1~2시간씩 이어가는 지속 가능한 리듬이 멀리 갑니다</text>
</svg>
