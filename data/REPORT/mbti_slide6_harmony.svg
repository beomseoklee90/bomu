<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="680" height="300" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left: Different Cognitive Lens -->
  <g transform="translate(55, 65)">
    <circle cx="70" cy="70" r="62" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="70" y="62" font-family="Pretendard, sans-serif" font-size="14" font-weight="800" fill="#0369a1" text-anchor="middle">나의 해석 렌즈</text>
    <text x="70" y="84" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="600" fill="#0284c7" text-anchor="middle">(내게 익숙한 화법)</text>
  </g>

  <!-- Center Bridge: Understanding Cognitive Differences -->
  <g transform="translate(215, 92)">
    <path d="M 0 45 Q 125 0, 250 45" fill="none" stroke="url(#bridgeGrad)" stroke-width="4" stroke-linecap="round"/>
    <rect x="35" y="25" width="180" height="44" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="125" y="45" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="800" fill="#065f46" text-anchor="middle">악의가 아닌 '해석 방식의 차이'</text>
    <text x="125" y="61" font-family="Pretendard, sans-serif" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">인지 프레임 이해 ➔ 오해 감소</text>
  </g>

  <!-- Right: Partner's Cognitive Lens -->
  <g transform="translate(485, 65)">
    <circle cx="70" cy="70" r="62" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="70" y="62" font-family="Pretendard, sans-serif" font-size="14" font-weight="800" fill="#b45309" text-anchor="middle">상대의 해석 렌즈</text>
    <text x="70" y="84" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="600" fill="#d97706" text-anchor="middle">(상대에게 자연스러운 화법)</text>
  </g>

  <text x="340" y="258" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">서로의 머릿속에 기본 탑재된 언어 번역기를 이해하면 대화가 한결 편안해집니다</text>
</svg>
