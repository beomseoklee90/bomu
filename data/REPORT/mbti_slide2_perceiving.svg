<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="100%" height="100%">
  <rect width="680" height="330" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 1. Ni (Top-Left): Funnel to Core Essence -->
  <g transform="translate(32, 24)">
    <rect width="296" height="132" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="18" y="16" width="108" height="24" rx="12" fill="#e0e7ff"/>
    <text x="72" y="32" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="800" fill="#4338ca" text-anchor="middle">내향 직관 (Ni)</text>

    <!-- Visual: Scattered Dots converging into One Star -->
    <g transform="translate(22, 54)">
      <circle cx="10" cy="10" r="4" fill="#818cf8"/><circle cx="10" cy="30" r="4" fill="#818cf8"/><circle cx="10" cy="50" r="4" fill="#818cf8"/>
      <path d="M 20 12 L 58 28 M 20 30 L 58 30 M 20 48 L 58 32" stroke="#6366f1" stroke-width="1.8"/>
      <circle cx="72" cy="30" r="13" fill="#4f46e5"/>
      <text x="72" y="34" font-family="Pretendard, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">핵심</text>
    </g>

    <text x="125" y="68" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="800" fill="#1e293b">본질·패턴 압축과 비유 요약</text>
    <text x="125" y="90" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="500" fill="#475569">중간 과정 생략, 핵심과 미래</text>
    <text x="125" y="108" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="500" fill="#475569">방향성을 비유적으로 요약</text>
  </g>

  <!-- 2. Ne (Top-Right): Diverging Tree of Ideas -->
  <g transform="translate(352, 24)">
    <rect width="296" height="132" rx="18" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="18" y="16" width="108" height="24" rx="12" fill="#e0f2fe"/>
    <text x="72" y="32" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="800" fill="#0369a1" text-anchor="middle">외향 직관 (Ne)</text>

    <!-- Visual: One Node branching into Many -->
    <g transform="translate(22, 54)">
      <circle cx="16" cy="30" r="11" fill="#0284c7"/>
      <path d="M 28 28 L 64 10 M 28 30 L 64 30 M 28 32 L 64 50" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="72" cy="10" r="6" fill="#38bdf8"/><circle cx="72" cy="30" r="6" fill="#38bdf8"/><circle cx="72" cy="50" r="6" fill="#38bdf8"/>
    </g>

    <text x="120" y="68" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="800" fill="#1e293b">아이디어 확장과 연상 발산</text>
    <text x="120" y="90" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="500" fill="#475569">하나의 키워드에서 꼬리에</text>
    <text x="120" y="108" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="500" fill="#475569">꼬리를 물고 화제가 확장됨</text>
  </g>

  <!-- 3. Si (Bottom-Left): Archive & Past Precedent -->
  <g transform="translate(32, 174)">
    <rect width="296" height="132" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="18" y="16" width="108" height="24" rx="12" fill="#dcfce7"/>
    <text x="72" y="32" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="800" fill="#15803d" text-anchor="middle">내향 감각 (Si)</text>

    <!-- Visual: Stacked Archive Cards -->
    <g transform="translate(26, 56)">
      <rect x="0" y="0" width="64" height="14" rx="4" fill="#bbf7d0" stroke="#22c55e"/>
      <rect x="0" y="18" width="64" height="14" rx="4" fill="#dcfce7" stroke="#22c55e"/>
      <rect x="0" y="36" width="64" height="14" rx="4" fill="#16a34a"/>
    </g>

    <text x="120" y="68" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="800" fill="#1e293b">경험 데이터와 정확한 사실 인용</text>
    <text x="120" y="90" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="500" fill="#475569">과거 경험·디테일을 대조하며</text>
    <text x="120" y="108" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="500" fill="#475569">날짜·전례 등 검증된 사실 인용</text>
  </g>

  <!-- 4. Se (Bottom-Right): Present Reality & Directness -->
  <g transform="translate(352, 174)">
    <rect width="296" height="132" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="18" y="16" width="108" height="24" rx="12" fill="#fef3c7"/>
    <text x="72" y="32" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">외향 감각 (Se)</text>

    <!-- Visual: Direct Target / Action Arrow -->
    <g transform="translate(26, 56)">
      <circle cx="34" cy="26" r="22" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="34" cy="26" r="9" fill="#d97706"/>
    </g>

    <text x="120" y="68" font-family="Pretendard, sans-serif" font-size="13.5" font-weight="800" fill="#1e293b">현재의 직관적 현실과 담백함</text>
    <text x="120" y="90" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="500" fill="#475569">추상적 이론보다 눈앞의 현실과</text>
    <text x="120" y="108" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="500" fill="#475569">즉각적 행동을 직관적으로 표현</text>
  </g>
</svg>
