<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%">
  <defs>
    <linearGradient id="mbBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="mbShadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="680" height="320" rx="24" fill="url(#mbBg1)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left Speaker: Type A Filter -->
  <g transform="translate(42, 46)" filter="url(#mbShadow1)">
    <rect width="176" height="168" rx="18" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="20" y="18" width="90" height="24" rx="12" fill="#e0f2fe"/>
    <text x="65" y="34" font-family="Pretendard, sans-serif" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">화자 A의 프레임</text>

    <circle cx="88" cy="86" r="24" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>
    <text x="88" y="91" font-family="Pretendard, sans-serif" font-size="14" font-weight="800" fill="#0284c7" text-anchor="middle">인식 · 판단</text>
    <text x="88" y="138" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">"핵심 구조와 결론"</text>
    <text x="88" y="155" font-family="Pretendard, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">중심으로 언어 표현</text>
  </g>

  <!-- Center: Interpretation Filter Prism -->
  <g transform="translate(244, 38)" filter="url(#mbShadow1)">
    <rect width="192" height="184" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="34" y="16" width="124" height="24" rx="12" fill="#f1f5f9"/>
    <text x="96" y="32" font-family="Pretendard, sans-serif" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">인식의 렌즈 (8기능)</text>

    <!-- Overlapping Speech Bubbles -->
    <rect x="24" y="56" width="102" height="44" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="75" y="82" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">같은 한국어 대화</text>

    <rect x="66" y="88" width="102" height="44" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="117" y="114" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">서로 다른 해석</text>

    <text x="96" y="162" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">이론 프레임 + 실제 관찰</text>
  </g>

  <!-- Right Speaker: Type B Filter -->
  <g transform="translate(462, 46)" filter="url(#mbShadow1)">
    <rect width="176" height="168" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="20" y="18" width="90" height="24" rx="12" fill="#fef3c7"/>
    <text x="65" y="34" font-family="Pretendard, sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">화자 B의 프레임</text>

    <circle cx="88" cy="86" r="24" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="88" y="91" font-family="Pretendard, sans-serif" font-size="14" font-weight="800" fill="#d97706" text-anchor="middle">경험 · 공감</text>
    <text x="88" y="138" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">"구체적 맥락과 배려"</text>
    <text x="88" y="155" font-family="Pretendard, sans-serif" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">중심으로 언어 수용</text>
  </g>

  <!-- Bottom Premise Banner -->
  <g transform="translate(42, 238)">
    <rect width="596" height="54" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="298" y="24" font-family="Pretendard, sans-serif" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">📌 전제: 과학적 절대 법칙이 아닌 '이론 프레임(카를 융·8기능) + 실제 사회생활 관찰' 결합 가이드</text>
    <text x="298" y="43" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle">개인의 성장 환경이나 성숙도에 따라 예외는 언제든 존재할 수 있습니다</text>
  </g>
</svg>
