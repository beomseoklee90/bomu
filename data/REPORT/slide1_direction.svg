<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="outerCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="innerCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="680" height="340" rx="24" fill="url(#bgGrad1)" />

  <!-- Left: Pride (Outward Gaze) -->
  <g transform="translate(36, 36)" filter="url(#softShadow)">
    <rect width="286" height="268" rx="20" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="20" y="20" width="96" height="28" rx="14" fill="url(#outerCard)"/>
    <text x="68" y="39" font-family="Pretendard, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">자존심 · 외부 시선</text>

    <!-- Center Person Node -->
    <circle cx="95" cy="145" r="28" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
    <circle cx="95" cy="137" r="9" fill="#ea580c"/>
    <path d="M79 160 C79 149, 111 149, 111 160" fill="#ea580c"/>
    <text x="95" y="192" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">나 (Me)</text>

    <!-- Outward Arrows to Others -->
    <path d="M132 132 L192 102" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
    <polygon points="196,100 185,100 190,109" fill="#f97316"/>

    <path d="M132 145 L192 145" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="198,145 188,140 188,150" fill="#f97316"/>

    <path d="M132 158 L192 188" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/>
    <polygon points="196,190 190,181 185,190" fill="#f97316"/>

    <!-- Target: Others -->
    <circle cx="226" cy="95" r="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="226" y="99" font-family="Pretendard, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">타인</text>

    <circle cx="226" cy="145" r="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="226" y="149" font-family="Pretendard, sans-serif" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">평가</text>

    <circle cx="226" cy="195" r="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="226" y="199" font-family="Pretendard, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">시선</text>

    <text x="143" y="242" font-family="Pretendard, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">시선의 방향: 바깥쪽 (타인)</text>
  </g>

  <!-- Right: Self-Esteem (Inward Gaze) -->
  <g transform="translate(358, 36)" filter="url(#softShadow)">
    <rect width="286" height="268" rx="20" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="20" y="20" width="96" height="28" rx="14" fill="url(#innerCard)"/>
    <text x="68" y="39" font-family="Pretendard, sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">자존감 · 내면 시선</text>

    <!-- Soft Aura Rings -->
    <circle cx="143" cy="142" r="64" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="5 5"/>
    <circle cx="143" cy="142" r="44" fill="#dcfce7" opacity="0.6"/>

    <!-- Center Self Node -->
    <circle cx="143" cy="142" r="28" fill="#ffffff" stroke="#22c55e" stroke-width="2.5"/>
    <circle cx="143" cy="134" r="9" fill="#16a34a"/>
    <path d="M127 157 C127 146, 159 146, 159 157" fill="#16a34a"/>

    <!-- Inward Arrows pointing to Self -->
    <path d="M62 142 L102 142" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="108,142 99,137 99,147" fill="#16a34a"/>

    <path d="M224 142 L184 142" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="178,142 187,137 187,147" fill="#16a34a"/>

    <path d="M143 64 L143 100" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="143,106 138,97 148,97" fill="#16a34a"/>

    <text x="143" y="242" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">시선의 방향: 안쪽 (나 자신)</text>
  </g>
</svg>
