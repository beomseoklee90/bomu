<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%">
  <defs>
    <linearGradient id="warmPathBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="680" height="320" rx="24" fill="url(#warmPathBg)" stroke="#fde68a" stroke-width="1.5"/>

  <!-- Soft Winding Path -->
  <path d="M 60 250 Q 210 265, 330 190 T 565 115" fill="none" stroke="#e2e8f0" stroke-width="38" stroke-linecap="round"/>
  <path d="M 60 250 Q 210 265, 330 190 T 565 115" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/>

  <!-- Step 1: Past -->
  <g transform="translate(115, 245)">
    <circle cx="0" cy="0" r="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#94a3b8"/>
    <text x="0" y="36" font-family="Pretendard, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">과거의 나 (수용과 용서)</text>
  </g>

  <!-- Step 2: Present Process -->
  <g transform="translate(335, 188)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="0" cy="0" r="7" fill="#0284c7"/>
    <text x="0" y="38" font-family="Pretendard, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">현재의 나 (과정 존중)</text>
  </g>

  <!-- Step 3: Warm Light (Self-Respect) -->
  <g transform="translate(555, 115)">
    <circle cx="0" cy="0" r="78" fill="url(#warmGlow)"/>
    <circle cx="0" cy="0" r="24" fill="#fef08a" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#d97706"/>
    <text x="0" y="48" font-family="Pretendard, sans-serif" font-size="13" font-weight="800" fill="#92400e" text-anchor="middle">나만의 속도로 자라는 자존감</text>
  </g>
</svg>
