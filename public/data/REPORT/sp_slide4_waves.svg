<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%">
  <rect width="680" height="320" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Grid -->
  <g stroke="#f1f5f9" stroke-width="1.5">
    <line x1="75" y1="65" x2="625" y2="65"/>
    <line x1="75" y1="130" x2="625" y2="130"/>
    <line x1="75" y1="195" x2="625" y2="195"/>
    <line x1="75" y1="255" x2="625" y2="255"/>
  </g>

  <!-- Axes -->
  <line x1="75" y1="45" x2="75" y2="260" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="75" y1="260" x2="630" y2="260" stroke="#cbd5e1" stroke-width="2"/>

  <text x="40" y="75" font-family="Pretendard, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">자극</text>
  <text x="40" y="92" font-family="Pretendard, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">강도</text>
  <text x="350" y="292" font-family="Pretendard, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">시간 및 행동의 지속 ➔</text>

  <!-- Fast & Steep Digital Stimuli Wave -->
  <path d="M 80 235 L 115 62 L 150 230 L 188 55 L 225 235 L 265 70 L 302 238 L 340 68 L 380 235 L 420 75 L 460 238 L 500 82 L 540 238 L 580 90 L 615 235"
        fill="none" stroke="#f97316" stroke-width="2.5" stroke-linejoin="round" opacity="0.88"/>

  <!-- Slow & Gentle Everyday Reward Curve -->
  <path d="M 80 225 C 210 220, 340 190, 470 155 C 530 140, 575 130, 615 125"
        fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>

  <!-- Legends -->
  <g transform="translate(85, 20)">
    <rect x="0" y="0" width="255" height="30" rx="15" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <line x1="16" y1="15" x2="40" y2="15" stroke="#f97316" stroke-width="2.5"/>
    <text x="48" y="19" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="700" fill="#c2410c">빠르고 즉각적인 자극 파형 (숏폼·알림)</text>
  </g>

  <g transform="translate(360, 20)">
    <rect x="0" y="0" width="265" height="30" rx="15" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
    <line x1="16" y1="15" x2="40" y2="15" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round"/>
    <text x="48" y="19" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">완만하고 느린 일상 보상 파형 (독서·학습)</text>
  </g>
