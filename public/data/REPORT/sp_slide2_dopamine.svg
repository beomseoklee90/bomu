<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%">
  <defs>
    <linearGradient id="spGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="680" height="320" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Baseline -->
  <line x1="60" y1="220" x2="620" y2="220" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Step 1: Cue / Starting Line (Anticipation Spike) -->
  <g transform="translate(175, 0)">
    <line x1="0" y1="65" x2="0" y2="220" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="0" cy="78" r="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="0" cy="78" r="9" fill="#d97706"/>
    <rect x="-82" y="24" width="164" height="30" rx="15" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <text x="0" y="43" font-family="Pretendard, sans-serif" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">⚡ 보상에 대한 기대 (출발선)</text>
    <text x="0" y="250" font-family="Pretendard, sans-serif" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle">1. 신호 감지 · 기대감 형성</text>
    <text x="0" y="270" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle">"다음엔 어떤 새로운 게 있을까?"</text>
  </g>

  <!-- Action Arrow -->
  <g transform="translate(340, 175)">
    <rect x="-58" y="-16" width="116" height="28" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="0" y="2" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">행동 유도 (동기 연료) ➔</text>
  </g>

  <!-- Step 2: Actual Outcome -->
  <g transform="translate(505, 0)">
    <line x1="0" y1="155" x2="0" y2="220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="0" cy="165" r="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <circle cx="0" cy="165" r="6" fill="#64748b"/>
    <rect x="-72" y="108" width="144" height="28" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="0" y="126" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">성취·결과 확인 순간</text>
    <text x="0" y="250" font-family="Pretendard, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">2. 실제 결과 도달</text>
    <text x="0" y="270" font-family="Pretendard, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle">기대 순간보다 상대적으로 완만한 신호</text>
  </g>

  <!-- Dopamine Signal Curve -->
  <path d="M 75 215 L 125 215 C 145 215, 155 78, 175 78 C 198 78, 215 195, 260 205 L 445 205 C 470 205, 485 165, 505 165 C 525 165, 540 212, 575 215 L 610 215 L 610 220 L 75 220 Z"
        fill="url(#spGrad2)"/>
  <path d="M 75 215 L 125 215 C 145 215, 155 78, 175 78 C 198 78, 215 195, 260 205 L 445 205 C 470 205, 485 165, 505 165 C 525 165, 540 212, 575 215 L 610 215"
        fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
</svg>
