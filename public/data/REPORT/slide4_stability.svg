<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="100%">
  <defs>
    <linearGradient id="stableArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="680" height="320" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Grid Lines -->
  <g stroke="#f1f5f9" stroke-width="1.5">
    <line x1="70" y1="65" x2="630" y2="65"/>
    <line x1="70" y1="125" x2="630" y2="125"/>
    <line x1="70" y1="185" x2="630" y2="185"/>
    <line x1="70" y1="245" x2="630" y2="245"/>
  </g>

  <!-- Axes -->
  <line x1="70" y1="45" x2="70" y2="265" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="70" y1="265" x2="635" y2="265" stroke="#cbd5e1" stroke-width="2"/>

  <text x="38" y="70" font-family="Pretendard, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">높음</text>
  <text x="38" y="160" font-family="Pretendard, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">자기</text>
  <text x="38" y="175" font-family="Pretendard, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">가치감</text>
  <text x="38" y="250" font-family="Pretendard, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">낮음</text>
  <text x="352" y="295" font-family="Pretendard, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">일상 속 외부 피드백과 시간의 흐름 ➔</text>

  <!-- Volatile Wave (Unstable Self-Esteem) -->
  <path d="M 75 180 C 115 45, 145 260, 190 120 C 235 35, 275 255, 325 160 C 375 50, 415 255, 465 110 C 515 40, 555 245, 615 170"
        fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.85"/>

  <!-- Stable Wave (Stable Self-Esteem) -->
  <path d="M 75 142 C 165 130, 255 154, 345 140 C 435 128, 525 150, 615 136 L 615 265 L 75 265 Z"
        fill="url(#stableArea)"/>
  <path d="M 75 142 C 165 130, 255 154, 345 140 C 435 128, 525 150, 615 136"
        fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>

  <!-- Dots on Stable Line -->
  <circle cx="195" cy="141" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
  <circle cx="345" cy="140" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
  <circle cx="495" cy="141" r="5" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>

  <!-- Legend Pills -->
  <g transform="translate(360, 22)">
    <rect x="0" y="0" width="265" height="32" rx="16" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
    <line x1="16" y1="16" x2="40" y2="16" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round"/>
    <text x="48" y="20" font-family="Pretendard, sans-serif" font-size="12" font-weight="700" fill="#0f766e">자존감 안정성이 높은 상태 (완만한 유지)</text>
  </g>

  <g transform="translate(85, 22)">
    <rect x="0" y="0" width="260" height="32" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <line x1="16" y1="16" x2="40" y2="16" stroke="#f97316" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="48" y="20" font-family="Pretendard, sans-serif" font-size="12" font-weight="600" fill="#c2410c">외부 평가에 크게 출렁이는 상태</text>
  </g>
</svg>
